    BasketItemStatus:
      type: string
      enum:
      - unreserved
      - reservation_pending
      - reserving
      - reserved
      - booking
      - fulfilment_pending
      - fulfilment_errored
      - booked
      - errored
      - seller_rejected
      - cancelling
      - cancelled
      - saved
      - errored_and_refunded
      title: BasketItemStatus
      description: '- unreserved: rereservation failed or hit max attempts and item will not attempt checkout

        - reservation_pending: item is pending re-reservation due to ttl expiry

        - reserving: item is currently locked for pending re-reservation due to ttl expiry

        - reserved: item availability is locked and being held until checkout

        - saved: item availability is not locked and item will attempt to book at checkout

        - booking: item is currently locked for pending checkout due to /basket/checkout or Stripe webhook

        - fulfilment_pending: item is waiting for fulfilment

        - fulfilment_errored: item booked but details not successfully retrieved

        - booked: item booked successfully

        - errored: item booking error

        - cancelled: item cancelled'
