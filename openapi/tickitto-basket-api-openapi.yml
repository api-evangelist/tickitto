components:
  schemas:
    Dropoff:
      properties:
        latitude:
          type: number
          title: Latitude
          description: Latitude in degrees
          examples:
          - 1.23456789
        longitude:
          type: number
          title: Longitude
          description: Longitude in degrees
          examples:
          - 1.23456789
        id:
          type: string
          title: Id
          description: Machine identifier for this place
          default: ''
          examples:
          - '123'
        dropoff_point_name:
          type: string
          title: Dropoff Point Name
          description: Friendly dropoff point name, in English
          examples:
          - North Hotel
        dropoff_point_address:
          type: string
          title: Dropoff Point Address
          description: Street address of the pickup point
          examples:
          - ''
        time:
          $ref: '#/components/schemas/EventDateTime'
      type: object
      required:
      - latitude
      - longitude
      - dropoff_point_name
      - dropoff_point_address
      - time
      title: Dropoff
    Pickup:
      properties:
        latitude:
          type: number
          title: Latitude
          description: Latitude in degrees
          examples:
          - 1.23456789
        longitude:
          type: number
          title: Longitude
          description: Longitude in degrees
          examples:
          - 1.23456789
        id:
          type: string
          title: Id
          description: Machine identifier for this place
          default: ''
          examples:
          - '123'
        pickup_point_name:
          type: string
          title: Pickup Point Name
          description: Friendly pickup point name, in English
          examples:
          - North Hotel
        pickup_point_address:
          type: string
          title: Pickup Point Address
          description: Street address of the pickup point
          examples:
          - ''
        time:
          $ref: '#/components/schemas/EventDateTime'
      type: object
      required:
      - latitude
      - longitude
      - pickup_point_name
      - pickup_point_address
      - time
      title: Pickup
    Image:
      properties:
        desktop:
          anyOf:
          - type: string
          - type: 'null'
          title: Desktop
          description: URL to use on desktop devices
        mobile:
          anyOf:
          - type: string
          - type: 'null'
          title: Mobile
          description: URL to use on mobile devices
        thumbnail:
          anyOf:
          - type: string
          - type: 'null'
          title: Thumbnail
          description: URL of a square version of this image
      type: object
      title: Image
    ErrorBody:
      properties:
        request_id:
          type: string
          title: Request Id
        detail:
          items:
            $ref: '#/components/schemas/Error'
          type: array
          title: Detail
        body:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Body
      type: object
      required:
      - request_id
      - detail
      title: ErrorBody
    StripeObject:
      properties:
        stripe_payment_intent:
          type: string
          title: Stripe Payment Intent
        stripe_payment_intent_secret:
          type: string
          title: Stripe Payment Intent Secret
        customer:
          $ref: '#/components/schemas/Customer'
      type: object
      required:
      - stripe_payment_intent
      - stripe_payment_intent_secret
      - customer
      title: StripeObject
    Barcode:
      properties:
        format:
          $ref: '#/components/schemas/BarcodeFormat'
          description: Data representation format.
        data:
          type: string
          minLength: 1
          title: Data
          description: Textual data represented by this barcode.
        raw_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Code
          description: The raw barcode code where it's not obtainable from `data`.
        image:
          type: string
          title: Image
          description: URL of this barcode; generally but not necessarily a data URL containing base64-encoded data.
      type: object
      required:
      - format
      - data
      - image
      title: Barcode
      description: Contains information about a barcode used to e.g. admit entry to an event by scanning using specialised hardware, a tablet or a smartphone.
    EventDateTime:
      properties:
        local:
          type: string
          format: date-time
          title: Local
          description: The date and time in the event's local timezone.
        utc:
          type: string
          format: date-time
          title: Utc
          description: The date and time in UTC.
      type: object
      required:
      - local
      - utc
      title: EventDateTime
      description: Represents a date and time relating to an event.
    OptionChoice:
      properties:
        option_id:
          type: string
          title: Option Id
        choice_value:
          title: Choice Value
          description: "Value chosen by the user. Type depends on the option:\n - `choice` ⇒ `values.*.value`\n - `number` ⇒ `number`\n - `datetime` ⇒ `datetime`\n - `location` ⇒ `LatitudeLongitude`\n - `text` ⇒ `string`"
        quantity:
          type: integer
          minimum: 1.0
          title: Quantity
          description: The amount of this option to book. Defaults to 1.
          default: 1
      additionalProperties: false
      type: object
      required:
      - option_id
      - choice_value
      title: OptionChoice
    Notes:
      properties:
        ticket_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Ticket Notes
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        short_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Short Description
      type: object
      title: Notes
    EventVenue:
      properties:
        latitude:
          type: number
          title: Latitude
          description: Latitude in degrees
          examples:
          - 1.23456789
        longitude:
          type: number
          title: Longitude
          description: Longitude in degrees
          examples:
          - 1.23456789
        id:
          type: string
          title: Id
          description: Machine identifier for this place
          default: ''
          examples:
          - '123'
        venue_brand_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Venue Brand Id
          description: The brand ID that operates the venue
        venue_address:
          type: string
          title: Venue Address
          description: Street address of the venue
          examples:
          - 27 Stadium Avenue
        seatplan_images:
          anyOf:
          - items:
              $ref: '#/components/schemas/Image'
            type: array
          - type: 'null'
          title: Seatplan Images
          description: Images of the venue's seatplan.
        configuration:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Configuration
        venue_name:
          type: string
          title: Venue Name
          description: Friendly venue name, in English
          examples:
          - Wembley Stadium
        venue_brand:
          anyOf:
          - type: string
          - type: 'null'
          title: Venue Brand
          description: The brand name that operates the venue
        venue_city:
          anyOf:
          - type: string
          - type: 'null'
          title: Venue City
          description: The city of the venue
          examples:
          - London
        venue_country:
          anyOf:
          - type: string
          - type: 'null'
          title: Venue Country
          description: The country of the venue
      type: object
      required:
      - latitude
      - longitude
      - venue_address
      - venue_name
      title: EventVenue
    AdmissionType:
      type: string
      enum:
      - open_entry
      - date_entry
      - slot_entry
      - timed_entry
      title: AdmissionType
    Reservation:
      properties:
        supplier_reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Supplier Reference
        external_reference:
          anyOf:
          - type: string
          - type: 'null'
          title: External Reference
        product_selection:
          type: string
          title: Product Selection
          description: Name of the ticket pool this reservation belongs to.
        concession_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Concession Id
        concession_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Concession Name
          description: Name of the concession applied to this reservation.
        seat_selection:
          anyOf:
          - type: string
          - type: 'null'
          title: Seat Selection
          description: Identifier for the seat booked for this reservation, if applicable.
        price:
          $ref: '#/components/schemas/Price'
          description: The price of this one reservation.
        commission:
          $ref: '#/components/schemas/Price'
          description: Amount of the price allocated for distributor commission
          default:
            amount: 0
            currency: GBP
        ticket:
          anyOf:
          - $ref: '#/components/schemas/Ticket'
          - type: 'null'
          description: Details of the booked and confirmed ticket associated with this reservation.
        voucher_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Voucher Url
          description: URL of the ticket voucher for the reservation.
      type: object
      required:
      - product_selection
      - price
      title: Reservation
      description: Represents a single seat, ticket etc. reservation to an event.
    Adjustment:
      properties:
        name:
          type: string
          title: Name
        type:
          $ref: '#/components/schemas/AdjustmentType'
        price:
          $ref: '#/components/schemas/PriceDelta'
      type: object
      required:
      - name
      - type
      - price
      title: Adjustment
    IsTbd:
      properties:
        time:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Time
          description: Whether the event time is to be determined
          default: false
        date:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Date
          description: Whether the event date is to be determined
          default: false
      type: object
      title: IsTbd
    InteleCommissionItem:
      properties:
        amount:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Amount
        currency:
          type: string
          title: Currency
        commission_percent:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Commission Percent
      type: object
      required:
      - amount
      - currency
      - commission_percent
      title: InteleCommissionItem
    Price:
      properties:
        amount:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Amount
          description: Monetary value of this price in the given currency, with decimal point i.e. not integer format
          examples:
          - '3.99'
        currency:
          type: string
          maxLength: 3
          minLength: 3
          pattern: '[A-Z][A-Z][A-Z]'
          title: Currency
          description: ISO 4217 code for the currency in which the item's prices are sent
          examples:
          - GBP
      type: object
      required:
      - amount
      - currency
      title: Price
      description: Represents an absolute monetary value in a particular currency. Cannot be negative.
    CareemPayObject:
      properties:
        invoice_id:
          type: string
          title: Invoice Id
        amount:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Amount
        currency:
          type: string
          title: Currency
        customer:
          $ref: '#/components/schemas/CareemCustomer'
        additional:
          additionalProperties: true
          type: object
          title: Additional
          default: {}
      type: object
      required:
      - invoice_id
      - amount
      - currency
      - customer
      title: CareemPayObject
    Personalisation:
      properties:
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
          description: Ticket holder's first name
          examples:
          - John
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
          description: Ticket holder's surname/family name
          examples:
          - Doe
        phone_number:
          anyOf:
          - type: string
            maxLength: 16
            minLength: 3
            pattern: \+?[0-9]{2,15}
          - type: 'null'
          title: Phone Number
          description: Ticket holder's phone number in E.164 format
          examples:
          - '+442087599036'
        email:
