  /api/basket/checkout:
    post:
      tags:
      - Basket
      summary: Checkout
      description: 'This endpoint is used to convert a basket''s reservations into confirmed bookings.


        When this call is made, items which are `reserved` or `errored` will immediately move to the `booking` state.

        Items in any other state - i.e. those that have have expired, are currently being booked or which have already been booked - will not be acted upon.


        By the time a response is returned, items will have moved to either `booked` or `errored`.


        A successful response indicates that all booking operations have finished, but does not indicate success of those bookings; this should be checked using each item''s `status` field.


        **Note:** the account associated with the provided key must first be enabled for on-account transactions before this request can succeed.'
      operationId: checkout_basket
      security:
      - APIKeyHeader: []
      parameters:
      - name: basket_id
        in: query
        required: true
        schema:
          type: string
          title: Basket Id
      - name: currency
        in: query
        required: false
        schema:
          type: string
          description: Currency to display event prices.
          default: GBP
          title: Currency
        description: Currency to display event prices.
      - name: should_raise
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Should Raise
      - name: accept-language
        in: header
        required: false
        schema:
          type: string
          default: en
          title: Accept-Language
