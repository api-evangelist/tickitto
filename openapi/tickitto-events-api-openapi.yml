              $ref: '#/components/schemas/Image'
            type: array
          - type: 'null'
          title: Seatplan Images
          description: Images of the venue's seatplan.
        configuration:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Configuration
        venue_name:
          type: string
          title: Venue Name
          description: Friendly venue name, in English
          examples:
          - Wembley Stadium
        venue_brand:
          anyOf:
          - type: string
          - type: 'null'
          title: Venue Brand
          description: The brand name that operates the venue
        venue_city:
          anyOf:
          - type: string
          - type: 'null'
          title: Venue City
          description: The city of the venue
          examples:
          - London
        venue_country:
          anyOf:
          - type: string
          - type: 'null'
          title: Venue Country
          description: The country of the venue
