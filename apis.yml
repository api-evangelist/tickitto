name: Tickitto
description: >-
  Tickitto is a London-based B2B ticketing marketplace that lets brands and platforms sell
  event tickets to their own customers through a single, fully transactional REST API. Its
  curated inventory spans 90,000+ events globally, mixing one-off sporting and music events
  with ongoing experiences, attractions, and tours. Tickitto positions itself as a marketplace
  rather than a channel manager: distributors keep their customer relationship and data while
  Tickitto tracks commission through a real-time dashboard. The API is availability-aware,
  organised around events, availability instances, and baskets, and ships an embeddable,
  white-labelable Ticket Selection Widget that renders event-specific UI (interactive seating
  maps, calendar dates, and time slots) so integrators avoid orchestrating multiple calls or
  building bespoke selection front-ends. Tickitto is backed by Seedcamp.
